<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mining Bot</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .coin-display { font-size: 32px; font-weight: bold; color: #fbbf24; margin: 10px 0; }
        .btn { background: #6366f1; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        .btn:active { transform: scale(0.98); }
        .btn-ads { background: #ec4899; }
        .energy-bar { font-size: 14px; color: #94a3b8; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h3>🪙 ဘယ်လိုလက်ကျန် (Balance)</h3>
        <div class="coin-display" id="balance">0.00</div>
        <p>Auto Mining Active: +0.1 Coin/sec</p>
    </div>

    <div class="card">
        <h3>⚡ Energy System</h3>
        <div class="energy-bar">Energy ကျန်ရှိမှု: <span id="energy">200</span> / 200</div>
        <button class="btn btn-ads" onclick="watchAdForEnergy()">ကြော်ငြာကြည့်၍ Energy ဖြည့်ရန် (15s)</button>
    </div>

    <div class="card">
        <button class="btn" onclick="openTasks()">📋 Tasks များ</button>
        <button class="btn" style="background: #10b981;" onclick="openWithdraw()">💸 Withdraw တောင်းရန်</button>
    </div>

    <script>
        let balance = 10.0;
        let energy = 200;
        const maxEnergy = 200;

        // Auto Mining (စက္ကန့်တိုင်း Coin တက်စေရန်)
        setInterval(() => {
            balance += 0.1;
            document.getElementById('balance').innerText = balance.toFixed(2);
        }, 1000);

        // ကြော်ငြာကြည့်ပြီး Energy 1 တိုးရန်
        function watchAdForEnergy() {
            if (energy >= maxEnergy) {
                alert("Energy ပြည့်နေပါပြီ မောင်ရေ!");
                return;
            }
            
            alert("ကြော်ငြာစတင်နေပါပြီ... (၁၅ စက္ကန့်စောင့်ပါ)");
            
            // ၁၅ စက္ကန့် Timer ဥပမာ
            setTimeout(() => {
                energy += 1;
                document.getElementById('energy').innerText = energy;
                alert("အောင်မြင်ပါသည်! Energy 1 ခု ရရှိပါပြီ။");
            }, 3000); // စမ်းသပ်ရန် 3 စက္ကန့်ထားပေးပါတယ် (Production မှာ 15000 ms ထားနိုင်ပါတယ်)
        }

        function openTasks() {
            alert("Tasks မျက်နှာပြင်သို့ ရောက်ရှိပါပြီ။");
        }

        function openWithdraw() {
            let amount = prompt("ထုတ်ယူလိုသည့် ပမာဏကို ထည့်ပါ:");
            if (amount) {
                alert(amount + " Coin အတွက် Withdraw တောင်းဆိုမှု ပေးပို့ပြီးပါပြီ။");
            }
        }
    </script>
</body>
</html>
