<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <!-- Telegram Web App JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: auto;
            padding-top: 30px;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        /* ကြော်ငြာလင့်ခ်ပါတဲ့ ခလုတ်ဒီဇိုင်း */
        .ad-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 14px 0;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transition: 0.2s;
            box-sizing: border-box;
        }
        .ad-btn:active {
            transform: scale(0.98);
        }
        .hidden {
            display: none;
        }
        .video-box {
            margin-top: 25px;
            animation: fadeIn 0.5s ease-in-out;
        }
        video {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎬 ဗီဒီယိုကြည့်ရှုရန်</h2>
        <p>အောက်ပါခလုတ်ကို နှိပ်ပြီး ကြော်ငြာကျော်ကာ ဗီဒီယိုကို တိုက်ရိုက်ကြည့်ရှုပါ။</p>

        <!-- တိုက်ရိုက်ထည့်ထားသော Adsterra Direct Link -->
        <a href="https://araplhn.org/4/5485f210cd45bf028dd9289dd52f5a19" 
           target="_blank" 
           class="ad-btn" 
           id="watchBtn" 
           onclick="revealVideo()">
           🚀 ဗီဒီယိုကြည့်ရန် နှိပ်ပါ
        </a>

        <!-- ဗီဒီယို ပြသမည့်နေရာ (အစမှာ ဖုံးထားသည်) -->
        <div id="videoContainer" class="hidden video-box">
            <h3 style="color: #22c55e; font-size: 16px; margin-bottom: 10px;">✅ ဗီဒီယို ပွင့်လာပါပြီ</h3>
            <video controls autoplay>
                <source src="your_video_link.mp4" type="video/mp4">
                သင့်ဖုန်း သို့မဟုတ် Browser သည် ဗီဒီယိုကို support မလုပ်ပါ။
            </video>
        </div>
    </div>

    <script>
        // Telegram Web App ကို စတင်ချိတ်ဆက်ရန်
        let tg = window.Telegram.WebApp;
        tg.expand();

        function revealVideo() {
            // ခလုတ်ကို နှိပ်လိုက်တာနဲ့ ကြော်ငြာလင့်ခ် ပွင့်သွားပြီးရင် 
            // ဒီကုဒ်က ဗီဒီယိုဖုံးထားတာကို ဖြုတ်ပြီး ချက်ချင်းပေါ်လာစေပါမယ်
            setTimeout(function() {
                document.getElementById('videoContainer').classList.remove('hidden');
                // လိုချင်ရင် ခလုတ်ကို ဖျောက်ချင်ပါက အောက်ပါလိုင်းကို ဖွင့်နိုင်ပါတယ်
                // document.getElementById('watchBtn').style.display = 'none';
            }, 300); // 0.3 စက္ကန့်အကြာမှာ ဗီဒီယို ပေါ်လာမည်
        }
    </script>

</body>
</html>
