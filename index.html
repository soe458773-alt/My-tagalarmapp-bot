<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hub - Video Player</title>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
        .container { margin-top: 20px; background: #1a1a1a; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 400px; margin-left: auto; margin-right: auto; }
        h2 { color: #00ffcc; font-size: 18px; }
        #timerText { font-size: 15px; margin: 10px 0; color: #ffcc00; }
        #watchBtn { display: none; background: #00C853; color: white; padding: 14px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; margin-top: 20px; width: 100%; box-sizing: border-box; }
        .ad-box { margin: 15px 0; background: #252525; border-radius: 8px; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 310px; }
    </style>

    <!-- ကိုကိုပေးထားသော Script (၁) -->
    <script data-cfasync="false" src="https://bauval.org/14/4587f6ec99043b05ff46ce9714215c21"></script>
</head>
<body>

    <div class="container">
        <h2>🎥 ဗီဒီယိုကြည့်ရှုရန် ခဏစောင့်ပါ</h2>
        <p id="timerText">ကျေးဇူးပြု၍ ကြော်ငြာကို ၂၀ စက္ကန့် စောင့်ကြည့်ပေးပါ...</p>
        <h1 id="countdown" style="font-size: 40px; color: #ff5722; margin: 10px 0;">20</h1>
        
        <!-- ကိုကိုပေးထားသော Script (၂) Banner Ad 160x300 ထည့်သွင်းသည့်နေရာ -->
        <div class="ad-box">
            <script>
              atOptions = {
                'key' : '372536289b0474a166e343269e91403a',
                'format' : 'iframe',
                'height' : 300,
                'width' : 160,
                'params' : {}
              };
            </script>
            <script src="https://bauval.org/22/372536289b0474a166e343269e91403a"></script>
        </div>

        <a id="watchBtn" href="#" target="_blank">👉 ဗီဒီယိုကြည့်ရန် နှိပ်ပါ</a>
    </div>

    <script>
        // URL ထဲက Video Link နဲ့ Admin ထည့်တဲ့ Ads Link ကို ဖမ်းယူခြင်း
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('video') ? decodeURIComponent(urlParams.get('video')) : "https://t.me/smarthubv1";
        const adsUrl = urlParams.get('ad') ? decodeURIComponent(urlParams.get('ad')) : "";

        const watchBtn = document.getElementById('watchBtn');
        
        // ၂၀ စက္ကန့် တိုင်မာ စတင်ခြင်း
        let timeLeft = 20;
        const countdownEl = document.getElementById('countdown');
        const timerText = document.getElementById('timerText');

        let timer = setInterval(function() {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                timerText.textContent = "✅ စောင့်ဆိုင်းပြီးပါပြီ၊ အောက်ပါခလုတ်ကို နှိပ်ပါ";
                countdownEl.style.display = 'none';
                
                // Admin ထည့်ပေးထားသော Ads link သို့မဟုတ် Video link သို့ သွားရန် ချိတ်ပေးခြင်း
                watchBtn.href = adsUrl ? adsUrl : videoUrl;
                watchBtn.style.display = 'inline-block';
            }
        }, 1000);
    </script>
</body>
</html>
